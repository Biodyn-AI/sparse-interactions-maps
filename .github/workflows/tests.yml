name: Integrity and bounded numerical tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/replay.txt
      - name: Check committed originals without downloads
        run: |
          python scripts/check_repository.py
          python -m unittest discover -s tests_release -v
      - name: Install CPU analysis dependencies only
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/replay.txt
      - name: Test score math and fixed protocol logic, not model acquisition
        run: >-
          python -m pytest
          tests/test_e33_sparse_interaction_diagnostics.py
          tests/test_e32_interpbench_scoring.py
          tests/test_e32_3_scoring.py
          tests/test_e32_4_scoring.py
      - name: Render current manuscript figures from audited values
        run: python papers/sparse-interaction-maps/scientific-reports/plot_figures.py --pdf-only
